name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read   # checkout
  pages: write     # deploy to Pages
  id-token: write  # OIDC token for Pages deployment

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Supabase credentials into env-config.js
        run: |
          cat > env-config.js << ENVEOF
          window.__ENV = {
            SUPABASE_URL: "$SUPABASE_URL",
            SUPABASE_ANON_KEY: "$SUPABASE_ANON_KEY"
          };
          ENVEOF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Stage deploy artefacts (include gitignored env-config.js)
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='doc' \
            --exclude='README.md' \
            --exclude='LICENSE' \
            --exclude='env-config.example.js' \
            --exclude='scratch' \
            --exclude='temp_backup' \
            --exclude='_site' \
            ./ _site/
          # Explicitly copy the generated env-config.js (gitignored but needed)
          cp env-config.js _site/env-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
